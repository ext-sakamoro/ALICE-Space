name: SGP4 golden (cross-platform)

# The SGP4 module evaluates every transcendental through alice-det-math, so the
# bits of the Vallado verification walk must be the same on every target. The
# main CI runs on Linux only; this workflow runs the bit golden (and the oracle
# it pins) on macOS, Windows and wasm32, and only when the code that feeds it
# changes.
on:
  # push has no `paths:` filter: on the first push of a new ci/ branch GitHub
  # evaluated it against the head commit alone, so a branch whose last commit
  # did not touch the SGP4 files skipped this workflow entirely. The `changes`
  # job decides instead, from everything the push brings against main.
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # the wasmtime release the wasm32 golden runs under; the check step fails
  # when the installed binary reports another version (not WASMTIME_VERSION:
  # the setup action exports that name with the full version line)
  WASMTIME_PIN: "50.0.0"

jobs:
  changes:
    name: SGP4 inputs changed
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # a pull request was already filtered by `paths:`; a manual run always runs
          if [ "${EVENT}" != push ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # main: the commits of this push; a ci/ branch: everything it changes
          # against main (a new branch has no usable "before")
          if [ "${REF}" = refs/heads/main ]; then
            # an unreachable "before" (a new branch, a rewritten history) gives
            # no diff to trust: run rather than skip
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "run=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            base="${BEFORE}"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          files="$(git diff --name-only "${base}" HEAD)"
          printf 'changed against %s:\n%s\n' "${base}" "${files}"
          # every Law's digest moves with any src/ file (tests/law_ids.rs), the SGP4 golden with its own
          pattern='^(src/|tests/law_ids\.rs|tests/law_ref_v2\.rs|tests/data/law/|src/sgp4\.rs|src/tle\.rs|src/lib\.rs|tests/sgp4_vallado\.rs|tests/tle_assumed_decimal\.rs|tests/data/sgp4/|Cargo\.toml|rust-toolchain\.toml|\.gitattributes|\.github/workflows/sgp4-golden\.yml)'
          if printf '%s\n' "${files}" | grep -Eq "${pattern}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

  golden:
    name: SGP4 golden (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: ""
          - name: Windows
            os: windows-latest
            target: ""
          - name: wasm32-wasip1
            os: ubuntu-latest
            target: wasm32-wasip1
    steps:
      - uses: actions/checkout@v5
      - name: Add the wasm target
        if: matrix.target != ''
        shell: bash
        run: rustup target add "${{ matrix.target }}"
      # the install script read its version from an API call that can fail and
      # still exit 0, leaving no wasmtime; the official action retries
      - name: Install wasmtime
        if: matrix.target != ''
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: ${{ env.WASMTIME_PIN }}
      - name: Check that the pinned wasmtime runs
        if: matrix.target != ''
        shell: bash
        run: |
          set -euo pipefail
          got="$(wasmtime --version)"
          echo "${got}"
          # "wasmtime 50.0.0 (ebe5e8df1 2026-10-20)": the second field
          if [ "$(echo "${got}" | awk '{print $2}')" != "${WASMTIME_PIN}" ]; then
            echo "::error::wasmtime reports '${got}', the pin is ${WASMTIME_PIN}"
            exit 1
          fi
      - name: Run the golden and the oracle it pins
        shell: bash
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=.
        run: |
          set -o pipefail
          target_args=()
          if [ -n "${{ matrix.target }}" ]; then
            target_args=(--target "${{ matrix.target }}")
          fi
          log="$(mktemp)"
          cargo test --release "${target_args[@]}" --test sgp4_vallado --test tle_assumed_decimal --test law_ids --test law_ref_v2 2>&1 | tee "${log}"
          # the walk's bit golden, the Vallado oracle, the decimal oracle and the Laws'
          # digests must each have run and passed: a filter that matched nothing would
          # report "0 passed" (the Law digests are the outputs' bits, so they must agree on
          # every target, NaN included)
          for name in the_walk_gives_the_same_bits_on_every_target \
                      every_state_matches_vallados_reference_output \
                      assumed_decimal_fields_decode_to_the_correctly_rounded_double \
                      reference_grids_are_frozen reference_digests semantics_ids; do
            if ! grep -E "^test ${name} \.\.\. ok" "${log}" >/dev/null; then
              echo "::error::${name} did not run and pass"
              exit 1
            fi
          done
          passed=$(grep -E '^test result: ' "${log}" | awk '{s += $4} END {print s + 0}')
          failed=$(grep -E '^test result: ' "${log}" | awk '{s += $6} END {print s + 0}')
          echo "passed: ${passed}, failed: ${failed}"
          if [ "${passed}" -lt 9 ] || [ "${failed}" -ne 0 ]; then
            echo "::error::expected at least 9 passed and 0 failed"
            exit 1
          fi
