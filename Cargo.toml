[package]
name = "alice-space"
version = "0.8.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "ALICE-Space — Deep-space communication, autonomous trajectory control, GNSS foundation (WGS-84 geodetic, TLE parser, DOP)"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Space"
keywords = ["space", "orbit", "gnss", "geodetic", "tle"]

[dependencies]
# every f64 transcendental of the SGP4 module goes through alice-det-math (bit-identical on all targets)
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", rev = "6384856c8b00f1615e1cd6b5c74d88036c1a8706", version = "0.5.2", default-features = false }
# the Sun and the Moon of the force model (ERFA epv00 / moon98) and the GCRS to CIRS matrix
alice-ephemeris = { git = "https://github.com/ext-sakamoro/ALICE-Ephemeris", rev = "6fb2014417b4eaa6fb0824d12b3a5e6565913ef3", version = "0.1.0" }
# the v2 law identifier and law reference the Laws are named by (src/law.rs)
alice-zip = { git = "https://github.com/ext-sakamoro/ALICE-Zip", rev = "3d75fcf316684df07195f2edabc64c5921f2cf83", version = "0.11.0", default-features = false }

[dev-dependencies]
# without the default `fork` and `timeout` features (rusty-fork and wait-timeout do
# not build for wasm32-wasip1, where the SGP4 golden runs); no test uses them
proptest = { version = "1.4", default-features = false, features = ["std", "bit-set"] }
sha2 = "0.10"

[lib]
name = "alice_space"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
ffi = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
