[package]
name = "alice-space"
version = "0.8.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "ALICE-Space — Deep-space communication, autonomous trajectory control, GNSS foundation (WGS-84 geodetic, TLE parser, DOP)"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Space"
keywords = ["space", "orbit", "gnss", "geodetic", "tle"]

[dependencies]
# every f64 transcendental of the SGP4 module goes through alice-det-math (bit-identical on all targets)
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", rev = "9252dd22b0aae3110687097836808572a5323947", version = "0.5.1", default-features = false }
# the Sun and the Moon of the force model (ERFA epv00 / moon98) and the GCRS to CIRS matrix
alice-ephemeris = { git = "https://github.com/ext-sakamoro/ALICE-Ephemeris", rev = "4d5a13ffe4923ce271f1598eb7f24f148d2e4f8f", version = "0.1.0" }

[dev-dependencies]
# without the default `fork` and `timeout` features (rusty-fork and wait-timeout do
# not build for wasm32-wasip1, where the SGP4 golden runs); no test uses them
proptest = { version = "1.4", default-features = false, features = ["std", "bit-set"] }
sha2 = "0.10"

[lib]
name = "alice_space"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
ffi = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
