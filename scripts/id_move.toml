# scripts/id_move_check.py (ALICE-Law G9): the identifiers whose value may move only with a
# breaking version (CHANGELOG naming both values). The Laws' identifiers moved to the v2 law
# identifier; their values before it are kept in alice_space::law::LEGACY_V1_IDS, which the
# previous-test recomputes. The check is wired into CI once the shared checker that reads the
# base from the newest version bump (this crate has no release tag) is copied here.
package = "alice-space"
manifest = "Cargo.toml"
tags = ["v{version}"]

[[id]]
path = "alice_space::law::SGP4_AFSPC_WGS72_ID"
previous = "alice_space::law::LEGACY_V1_IDS"
previous-tests = ["tests/law_ids.rs::legacy_v1_identifiers_are_reproduced"]

[[id]]
path = "alice_space::law::ODM_INTERP_LAGRANGE_ID"
previous = "alice_space::law::LEGACY_V1_IDS"
previous-tests = ["tests/law_ids.rs::legacy_v1_identifiers_are_reproduced"]

