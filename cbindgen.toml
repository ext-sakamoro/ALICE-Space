# C header of the FFI (src/ffi.rs only): bindings/ue5/AliceSpace.h is generated with
#   cbindgen --config cbindgen.toml --output bindings/ue5/AliceSpace.h src/ffi.rs
# and CI regenerates it and compares the bytes
language = "C"
pragma_once = true
cpp_compat = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
header = "// AliceSpace.h — C FFI header for alice-space (UE5 and any C host)\n// Generated by cbindgen from src/ffi.rs; do not edit"
autogen_warning = ""
documentation = true
documentation_style = "c99"
style = "both"
